name: Run Flyway Migrations

on:
  push:
    branches:
      - dev

jobs:
  flyway-migrate:
    runs-on: [self-hosted, windows]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Install Chocolatey if not installed
      - name: Install Chocolatey
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
              echo "Chocolatey not found. Installing Chocolatey..."
              Set-ExecutionPolicy Bypass -Scope Process -Force;
              [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072;
              iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))
          } else {
              echo "Chocolatey is already installed. Skipping installation."
          }
        shell: powershell

      # Install Java if not installed
      - name: Install Java (OpenJDK 11)
        run: |
          $javaInstalled = Get-Command java -ErrorAction SilentlyContinue
          if ($null -eq $javaInstalled) {
              echo "Java not found. Installing OpenJDK 11..."
              choco install openjdk11 --force
          } else {
              echo "Java is already installed. Skipping installation."
          }
        shell: powershell

      - name: Set up Flyway
        run: |
          $flywayPath = "C:\opt\flyway\flyway-11.3.1"

          if (Test-Path $flywayPath) {
              echo "Flyway is already installed. Skipping download."
          } else {
              echo "Downloading Flyway..."
              Invoke-WebRequest -Uri "https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/11.3.1/flyway-commandline-11.3.1-windows-x64.zip" -OutFile "flyway.zip"
              echo "Download complete."

              echo "Extracting Flyway..."
              Expand-Archive -Path "flyway.zip" -DestinationPath "C:\opt\flyway" -Force
              echo "Extraction complete."
          }

          echo "Adding Flyway to PATH..."
          echo "PATH=C:\opt\flyway\flyway-11.3.1;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "Flyway setup complete."
        shell: powershell

      - name: Test Database Connection
        run: |
          if ((Test-NetConnection -ComputerName 192.168.4.37 -Port 1433).TcpTestSucceeded) { echo "Port open" } else { echo "Cannot connect" }

      - name: Create database if it doesn't exist
        run: |
          echo "Creating database if it doesn't exist..."
          sqlcmd -S 192.168.4.37,1433 -U $Env:DB_USER -P $Env:DB_PASSWORD -d master -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = 'ArgaamScreener_DEV') CREATE DATABASE ArgaamScreener_DEV;"
        shell: powershell
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Run Flyway Migrations
        run: |
          echo "Running Flyway migration..."
          C:\opt\flyway\flyway-11.3.1\flyway -url="$env:DB_URL" `
                              -user="$env:DB_USER" `
                              -password="$env:DB_PASSWORD" `
                              -locations=filesystem:./migrations migrate
        shell: powershell
        env:
          DB_URL: jdbc:sqlserver://192.168.4.37,1433\SQLEXPRESS;databaseName=master;encrypt=false;
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
