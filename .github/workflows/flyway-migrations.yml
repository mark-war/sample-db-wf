name: Run Flyway Migrations

on:
  push:
    branches:
      - dev

jobs:
  flyway-migrate:
    runs-on: [self-hosted, windows]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Install Chocolatey if not installed
      - name: Install Chocolatey
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
              echo "Chocolatey not found. Installing Chocolatey..."
              Set-ExecutionPolicy Bypass -Scope Process -Force;
              [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072;
              iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))
          } else {
              echo "Chocolatey is already installed. Skipping installation."
          }
        shell: powershell

      # Install Java if not installed
      - name: Install Java (OpenJDK 11)
        run: |
          $javaInstalled = Get-Command java -ErrorAction SilentlyContinue
          if ($null -eq $javaInstalled) {
              echo "Java not found. Installing OpenJDK 11..."
              choco install openjdk11 --force
          } else {
              echo "Java is already installed. Skipping installation."
          }
        shell: powershell

      # Set up Flyway
      - name: Set up Flyway
        shell: powershell
        run: |
          $flywayPath = "C:\opt\flyway\flyway-11.3.1"

          if (Test-Path $flywayPath) {
              echo "Flyway is already installed. Skipping download."
          } else {
              echo "Downloading Flyway..."
              Invoke-WebRequest -Uri "https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/11.3.1/flyway-commandline-11.3.1-windows-x64.zip" -OutFile "flyway.zip"
              echo "Download complete."

              echo "Extracting Flyway..."
              Expand-Archive -Path "flyway.zip" -DestinationPath "C:\opt\flyway" -Force
              echo "Extraction complete."
          }

          echo "Adding Flyway to PATH..."
          echo "PATH=C:\opt\flyway\flyway-11.3.1;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "Flyway setup complete."

          Write-Output "Downloading SQL Server JDBC Driver using curl..."
          curl.exe -L -o sqljdbc.zip "https://go.microsoft.com/fwlink/?linkid=2136024"

          if (Test-Path "sqljdbc.zip") {
              $fileSize = (Get-Item "sqljdbc.zip").length
              if ($fileSize -gt 1024) {
                  Write-Output "Download successful!"
              } else {
                  Write-Output "Downloaded file is too small. Exiting..."
                  exit 1
              }
          } else {
              Write-Output "Download failed. Exiting..."
              exit 1
          }

      # Test Database Connection
      - name: Test Database Connection
        run: |
          if ((Test-NetConnection -ComputerName 192.168.4.37 -Port 1433).TcpTestSucceeded) { echo "Port open" } else { echo "Cannot connect" }

      #   # Create database if it doesn't exist
      # - name: Create database if it doesn't exist
      #   run: |
      #     echo "Creating database if it doesn't exist..."
      #     sqlcmd -S 192.168.4.37,1433 -U $Env:DB_USER -P $Env:DB_PASSWORD -d master -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = 'ArgaamScreener_DEV') CREATE DATABASE ArgaamScreener_DEV;"
      #   shell: powershell
      #   env:
      #     DB_USER: ${{ secrets.DB_USER }}
      #     DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      # Backup Database before Migration
      - name: Backup Database
        run: |
          echo "Backing up database before migration..."
          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
          $backupFile = "C:\backups\ArgaamScreener_DEV_$timestamp.bak"

          # Ensure backup directory exists
          if (-not (Test-Path "C:\backups")) {
            New-Item -Path "C:\backups" -ItemType Directory
          }

          # Run SQLCMD to back up the database
          sqlcmd -S 192.168.4.37,1433 -U $Env:DB_USER -P $Env:DB_PASSWORD -Q "BACKUP DATABASE [ArgaamScreener_DEV] TO DISK = '$backupFile' WITH FORMAT, INIT, NAME = 'ArgaamScreener_DEV-Full Database Backup';"

          if (Test-Path $backupFile) {
            echo "Backup successful: $backupFile"
          } else {
            echo "Database backup failed!"
            exit 1
          }
        shell: powershell
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      # Run Flyway Migrations
      - name: Run Flyway Migrations
        run: |
          echo "Listing migration files..."
          # List the files to ensure Flyway can access the migration directory
          Get-ChildItem -Path "C:\Users\mark\Working Directory\sqlserver-db\migrations"

          echo "Running Flyway migration..."

          # Log the environment variables to ensure they are correctly set
          echo "DB_URL: $env:DB_URL"
          echo "DB_USER: $env:DB_USER"

          # Define Flyway executable path and arguments
          $flywayCommand = "C:\opt\flyway\flyway-11.3.1\flyway.cmd"

          # Quote paths properly and escape them
          # $arguments = "-X -databaseType=sqlserver -url=`"$env:DB_URL`" -user=`"$env:DB_USER`" -password=`"$env:DB_PASSWORD`" -locations=`"filesystem:C:\Users\mark\Working Directory\sqlserver-db\migrations`" migrate"
          $arguments = "-X -url=`"$env:DB_URL`" -user=`"$env:DB_USER`" -password=`"$env:DB_PASSWORD`" -locations=`"filesystem:C:\Users\mark\Working Directory\sqlserver-db\migrations`" migrate"

          # Log the constructed Flyway command to ensure it's formed correctly
          echo "Running command: $flywayCommand $arguments"

          # Ensure temp directory exists
          $tempDir = "C:\temp"
          if (-not (Test-Path $tempDir)) {
            New-Item -Path $tempDir -ItemType Directory
          }

          # Capture detailed output from Flyway migration
          try {
            $process = Start-Process -FilePath $flywayCommand -ArgumentList $arguments -PassThru -Wait -RedirectStandardOutput "C:\temp\flyway-output.log" -RedirectStandardError "C:\temp\flyway-error.log"
            $exitCode = $process.ExitCode

            # Log Flyway output and error
            Write-Host "Flyway Standard Output: $(Get-Content 'C:\temp\flyway-output.log')"
            Write-Host "Flyway Error Output: $(Get-Content 'C:\temp\flyway-error.log')"

            echo "Flyway migration exit code: $exitCode"

            if ($exitCode -ne 0) {
              Write-Error "Flyway migration failed with exit code $exitCode"
              exit $exitCode
            } else {
              echo "Flyway migration completed successfully."
            }
          } catch {
            Write-Error "Flyway migration encountered an error: $_"
            exit 1
          }
        shell: powershell
        env:
          DB_URL: jdbc:sqlserver://192.168.4.37:1433;databaseName=ArgaamScreener_DEV;encrypt=false;trustServerCertificate=true;applicationName=Flyway
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      # Check migration results
      - name: Check migration result
        run: |
          if ($LastExitCode -ne 0) {
            Write-Error "Flyway migration failed with exit code $LastExitCode"
            exit $LastExitCode
          } else {
            echo "Flyway migration completed successfully."
          }
        shell: powershell

      # Display Flyway logs
      - name: Display Flyway logs
        run: |
          Get-Content "C:\opt\flyway\flyway-11.3.1\logs\flyway.log" -Tail 20
        shell: powershell
