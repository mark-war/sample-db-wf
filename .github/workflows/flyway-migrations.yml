name: Run Flyway Migrations

on:
  push:
    branches:
      - dev

jobs:
  flyway-migrate:
    runs-on: [self-hosted, windows]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # - name: Install Chocolatey in custom path
      #   run: |
      #     [Environment]::SetEnvironmentVariable('CHOCOLATEY_INSTALL', 'C:\Chocolatey', [System.EnvironmentVariableTarget]::User)
      #     Set-ExecutionPolicy Bypass -Scope Process -Force;
      #     [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072;
      #     iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))
      #   shell: powershell

      # - name: Install Chocolatey
      #   run: |
      #     Set-ExecutionPolicy Bypass -Scope Process -Force;
      #     [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072;
      #     iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))
      #   shell: powershell

      # - name: Install Java
      #   run: choco install openjdk11 --force
      #   shell: powershell

      - name: Set up Flyway
        run: |
          # Download Flyway using PowerShell's Invoke-WebRequest
          Invoke-WebRequest -Uri https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/11.3.1/flyway-commandline-11.3.1-linux-x64.tar.gz -OutFile flyway-commandline-11.3.1-linux-x64.tar.gz
          # Extract the tar.gz file
          tar -xzvf flyway-commandline-11.3.1-linux-x64.tar.gz
          # Move flyway files to /opt/flyway (adjust path if needed for Windows)
          Move-Item -Path flyway-* -Destination "C:\opt\flyway"
          # Add Flyway to PATH
          echo "C:\opt\flyway" >> $env:GITHUB_ENV

      - name: Test Database Connection
        run: |
          nc -zv 192.168.4.37 1433 && echo "Port open" || echo "Cannot connect"

      - name: Run Flyway Migrations
        run: |
          /opt/flyway/flyway -url="${{ secrets.DB_URL }}" \
                             -user="${{ secrets.DB_USER }}" \
                             -password="${{ secrets.DB_PASSWORD }}" \
                             -locations=filesystem:./migrations migrate
        env:
          DB_URL: jdbc:sqlserver://192.168.4.37,1433\SQLEXPRESS;databaseName=yourDB;encrypt=false;
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
