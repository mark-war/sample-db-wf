name: Rollback Flyway to V6

on:
  workflow_dispatch: # Allows manual trigger

jobs:
  flyway-rollback:
    runs-on: [self-hosted, windows]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Flyway
        shell: powershell
        run: |
          $flywayPath = "C:\opt\flyway\flyway-11.3.1"
          echo "Using Flyway path: $flywayPath"
          echo "FLYWAY_HOME=$flywayPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Install sqlcmd (SQL Server Command Line Tools)
        run: |
          # Define the download URL and the target path
          $url = "https://aka.ms/sqlcmdlinetools"
          $zipFilePath = "sqlcmd.zip"
          $destinationPath = "C:\opt\sqlcmd"

          # Download the file and follow redirects
          Write-Host "Downloading SQL Server Command Line Tools..."
          Invoke-WebRequest -Uri $url -OutFile $zipFilePath -Method GET -MaximumRedirection 5

          # Check if the file was downloaded successfully
          if (-Not (Test-Path $zipFilePath)) {
            Write-Error "The ZIP file could not be downloaded. Exiting."
            exit 1
          }

          # Verify that the file is a ZIP file by checking its content type
          $fileType = [System.IO.Path]::GetExtension($zipFilePath)
          if ($fileType -ne ".zip") {
            Write-Error "The downloaded file is not a ZIP file. Exiting."
            exit 1
          }

          # Check if the ZIP file is valid by attempting to open it
          try {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($zipFilePath)
            $zip.Close()
          } catch {
            Write-Error "The ZIP file is corrupted or invalid. Exiting."
            exit 1
          }

          # Extract the ZIP file
          Write-Host "Extracting SQL Server Command Line Tools..."
          Expand-Archive -Path $zipFilePath -DestinationPath $destinationPath

          # Add the extracted tools to the system PATH
          Write-Host "Adding SQL Server tools to PATH..."
          [System.Environment]::SetEnvironmentVariable('PATH', "$env:PATH;$destinationPath", [System.EnvironmentVariableTarget]::Machine)

          Write-Host "SQL Server Command Line Tools installed successfully."

      - name: Check Current Flyway Version
        run: |
          echo "Checking current Flyway version..."
          & "C:\opt\flyway\flyway-11.3.1\flyway.cmd" info -url="$env:DB_URL" -user="$env:DB_USER" -password="$env:DB_PASSWORD"
        shell: powershell
        env:
          DB_URL: "jdbc:sqlserver://localhost:1433;databaseName=ArgaamScreener_DEV;encrypt=false;trustServerCertificate=true;applicationName=Flyway"
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Run Rollback SQL Script (Undo V7)
        run: |
          echo "Rolling back to V6 by running rollback SQL script..."
          sqlcmd -S localhost -d ArgaamScreener_DEV -U $env:DB_USER -P $env:DB_PASSWORD -i rollback-scripts/V7__rollback.sql
        shell: powershell
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Re-baseline Flyway to V6
        run: |
          echo "Re-baselining Flyway to V6..."
          & "C:\opt\flyway\flyway-11.3.1\flyway.cmd" baseline -baselineVersion=6 -url="$env:DB_URL" -user="$env:DB_USER" -password="$env:DB_PASSWORD"
        shell: powershell
        env:
          DB_URL: "jdbc:sqlserver://localhost:1433;databaseName=ArgaamScreener_DEV;encrypt=false;trustServerCertificate=true;applicationName=Flyway"
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
