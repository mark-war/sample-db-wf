name: Run Flyway Migrations

on:
  push:
    branches:
      - dev

jobs:
  flyway-migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Java
        run: sudo apt-get install -y openjdk-11-jdk

      - name: Set up Flyway
        run: |
          wget -qO- https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/11.3.1/flyway-commandline-11.3.1-linux-x64.tar.gz | tar xz
          sudo mv flyway-*/ /opt/flyway
          echo "PATH=/opt/flyway:$PATH" >> $GITHUB_ENV

      - name: Test Database Connection
        run: |
          nc -zv 192.168.4.37 1433 && echo "Port open" || echo "Cannot connect"

      - name: Run Flyway Migrations
        run: |
          /opt/flyway/flyway -url="${{ secrets.DB_URL }}" \
                             -user="${{ secrets.DB_USER }}" \
                             -password="${{ secrets.DB_PASSWORD }}" \
                             -locations=filesystem:./migrations migrate
        env:
          DB_URL: jdbc:sqlserver://192.168.4.37,1433\SQLEXPRESS;databaseName=yourDB;encrypt=false;
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
